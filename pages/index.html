<!DOCTYPE html>
<html lang="pt-br">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Chá de Panela | Login</title>
      <link rel="stylesheet" href="../styles/index.css" />
   </head>
   <body>
      <main>
         <section id="login" class="container">
            <nav>
               <h1>Portal de Presentes</h1>
            </nav>

            <div id="fields-box">
               <form action="/" method="post">
                  <div id="fields-wrapper">
                     <label for="guest_number">Número de Convidado</label>
                     <input id="guest_number" type="number"/>
                     
                     <p>Preencha o campo com número que está no convite</p>

                     <button>ENTRAR</button>
                  </div>
               </form>
            </div>
         </section>
      </main>
   </body>
</html>
