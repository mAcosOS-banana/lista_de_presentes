<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login | Lista de Presentes Hortinbox</title>
  <link rel="stylesheet" href="../static/styles.css">
</head>
<body>
  <header><h1>🎁 Entrar na lista de presentes</h1></header>

  <main style="display:flex;justify-content:center;align-items:center;flex-direction:column;">
    <form id="loginForm" style="background:white;padding:2rem;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);">
      <label>ID do Convidado</label><br>
      <input type="number" id="guest_id" required style="padding:0.7rem;width:100%;margin-top:0.5rem;border-radius:8px;border:1px solid #ccc;">
      <button type="submit" style="width:100%;margin-top:1rem;">Entrar</button>
    </form>
  </main>

  <footer><p>Chá de Panela - Marcos & Nayara</p></footer>
  <script src="../static/script.js"></script>
</body>
</html>
